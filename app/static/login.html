<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Iniciar Sesión — SimpliTV</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" type="image/png" href="/static/favicon.png">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="channel-badge">
          <span class="live-dot"></span>
          <span class="channel-name">SIMPLITV</span>
        </div>
        <h1>Acceso Privado</h1>
        <p>Introduce tus credenciales para acceder a la emisión.</p>
      </div>

      <div id="login-error" class="alert-error hidden"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            placeholder="Introduce tu usuario"
            maxlength="50"
            autocomplete="username"
            autofocus
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            maxlength="128"
            autocomplete="current-password"
            placeholder="Introduce tu contraseña"
          />
        </div>

        <button type="submit" id="btn-submit" class="btn-primary btn-block">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>

  <script src="/static/js/login.js" defer></script>
</body>
</html>
