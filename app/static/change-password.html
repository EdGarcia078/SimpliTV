<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cambiar contraseña — SimpliTV</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" type="image/png" href="/static/favicon.png" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="channel-badge">
          <span class="live-dot"></span>
          <span class="channel-name">SIMPLITV</span>
        </div>
        <h1>Protege tu administrador</h1>
        <p>La cuenta inicial usa una contraseña conocida. Debes reemplazarla antes de continuar.</p>
      </div>

      <div id="password-change-error" class="alert-error hidden"></div>

      <form id="password-change-form" class="auth-form" autocomplete="off">
        <div class="form-group">
          <label for="current-password">Contraseña actual</label>
          <input id="current-password" type="password" required maxlength="128" autocomplete="current-password" />
        </div>
        <div class="form-group">
          <label for="new-password-required">Nueva contraseña</label>
          <input id="new-password-required" type="password" required minlength="12" maxlength="128" autocomplete="new-password" placeholder="Mínimo 12 caracteres" />
        </div>
        <div class="form-group">
          <label for="confirm-password-required">Confirmar nueva contraseña</label>
          <input id="confirm-password-required" type="password" required minlength="12" maxlength="128" autocomplete="new-password" />
        </div>
        <button type="submit" id="btn-change-required-password" class="btn-primary btn-block">Guardar contraseña</button>
      </form>
    </div>
  </div>
  <script src="/static/js/change-password.js" defer></script>
</body>
</html>
